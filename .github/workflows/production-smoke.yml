name: TLC production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production HTTP routes and access control
        env:
          TLC_URL: https://tlc-ruby.vercel.app
        run: |
          node <<'NODE'
          const base = process.env.TLC_URL;
          const routes = [
            ['/home', 'html'],
            ['/api/projects', 'array', 1],
            ['/api/contributors', 'array', 10],
            ['/api/profiles', 'array', 4],
            ['/api/data/events', 'array', 4],
            ['/api/community/members', 'array', 4],
            ['/api/discussions', 'array', 1],
            ['/api/experiments', 'array', 1]
          ];
          async function retry(url, init, expectedStatus = 200) {
            let last = '';
            for (let attempt = 0; attempt < 12; attempt++) {
              try {
                const response = await fetch(url, {...init, redirect: 'follow', signal: AbortSignal.timeout(10000)});
                const body = await response.text();
                if (response.status === expectedStatus) return {response, body};
                last = 'HTTP ' + response.status + ' ' + body.slice(0, 120);
              } catch (error) {
                last = String(error);
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error(url + ': ' + last);
          }
          (async () => {
            for (const [path, type, min] of routes) {
              const {body} = await retry(base + path);
              if (type === 'html' && !body.includes('TLC')) throw new Error(path + ' is not TLC HTML');
              if (type === 'array') {
                const data = JSON.parse(body);
                if (!Array.isArray(data) || data.length < min) throw new Error(path + ' has missing records');
                console.log(path + ': ' + data.length + ' items');
              } else console.log(path + ': HTML OK');
            }
            await retry(base + '/api/projects', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({title:'unauthorized-smoke'})
            }, 401);
            console.log('Unauthorized write: 401 OK');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
